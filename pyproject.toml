[project]
name = "totale-gestao-operacional"
version = "2.6.0"
description = "Plataforma corporativa de Inteligência & Gestão Operacional da Totale — monitoramento integrado de Produção Técnica (Prod/Gpon), Ordens de Serviço, Contratos, Performance Consultiva (NetSales) e Quadro Ativo."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Totale · Engenharia & Operações" },
]
keywords = [
    "totale",
    "gestao-operacional",
    "business-intelligence",
    "analytics",
    "streamlit",
    "producao",
    "consultivo",
    "kpis",
]

[project.urls]
Repository = "https://github.com/denisvick-dev/totale-gestao-operacional"
Issues = "https://github.com/denisvick-dev/totale-gestao-operacional/issues"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# E402 é intencional: structlog é configurado antes da importação dos módulos do app.
select = ["E4", "E7", "E9", "F", "B", "W", "PIE"]
ignore = ["E402"]

[tool.pyright]
include = [
    "streamlit_app.py",
    "production.py",
    "drive_import.py",
    "components",
    "scripts",
    "tests",
]
extraPaths = ["."]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportUnusedFunction = "warning"
reportDuplicateImport = "warning"
reportUnnecessaryCast = "warning"

