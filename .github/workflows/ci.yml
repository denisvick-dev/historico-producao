name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff mypy

      - name: Lint (ruff)
        run: |
          # E402 is intentional: structlog is configured before importing app modules.
          ruff check . --select E4,E7,E9,F --ignore E402
          # Limit format checks to modified modules; legacy files have formatting drift.
          ruff format --check \
            streamlit_app.py \
            components/visoes_dashboards.py \
            tests/test_visoes_dashboards.py \
            tests/test_streamlit_app.py

      - name: Type checking (mypy)
        run: |
          mypy \
            --follow-imports=silent \
            --disable-error-code=type-arg \
            --disable-error-code=no-any-return \
            --disable-error-code=unused-ignore \
            production.py drive_import.py components/componentes.py \
            components/css_global.py components/prod_os.py \
            streamlit_app.py components/visoes_dashboards.py

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Compile check
        run: |
          python -m py_compile streamlit_app.py production.py drive_import.py
          python -m py_compile components/componentes.py components/css_global.py components/prod_os.py
