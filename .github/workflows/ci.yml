name: Qualidade & CI · Totale Gestão Operacional

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff mypy pyright pandas-stubs types-openpyxl

      - name: Lint (ruff)
        run: python scripts/check.py lint

      - name: Type checking (mypy + pyright/Pylance)
        run: python scripts/check.py types

      - name: Run unit tests
        run: python scripts/check.py tests

      - name: Compile check
        run: python scripts/check.py compile
