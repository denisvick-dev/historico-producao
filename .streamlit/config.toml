[theme]
primaryColor = "#012869"
backgroundColor = "#F3F6FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#122033"
# Inter para texto do app e para grades nativas renderizadas em canvas.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
dataframeHeaderBackgroundColor = "#012869"
dataframeHeaderTextColor = "#FFFFFF"
dataframeBorderColor = "#E6EDF5"

[server]
headless = true
maxUploadSize = 200

[browser]
gatherUsageStats = false
